<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Razef Assistant</title>
<style>
/* ------------------------------------------------------------------
   Razef Assistant - single file UI.
   Everything is inline on purpose: Razef ships an immutable system
   image, so no CDN, no webfont fetch, no build step.
   ------------------------------------------------------------------ */
:root{
  --bg:#05070d; --bg-2:#0a0e1a; --panel:#0b1020cc; --stroke:#1c2540;
  --txt:#e8ecf8; --dim:#8b96b4; --dim-2:#5d6884;
  --cyan:#22d3ee; --violet:#7c3aed; --cyan-soft:#22d3ee22; --violet-soft:#7c3aed22;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --radius:14px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--txt); background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 12% -10%, #0b2a3a 0%, transparent 60%),
    radial-gradient(700px 500px at 96% 108%, #1a0f3d 0%, transparent 62%);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ---------- top bar ---------- */
header{
  display:flex; align-items:center; gap:14px; padding:12px 18px;
  border-bottom:1px solid var(--stroke); background:#070a13cc; backdrop-filter:blur(12px);
  -webkit-app-region:drag; flex:0 0 auto;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:.2px}
.brand svg{width:26px; height:26px; filter:drop-shadow(0 0 8px #22d3ee66)}
.brand .sub{color:var(--dim-2); font-weight:450; font-size:12px; margin-left:2px}
.spacer{flex:1}
.pill{
  display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim);
  border:1px solid var(--stroke); padding:5px 11px; border-radius:999px; background:#0a0f1c;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);box-shadow:0 0 0 3px #ffffff08}
.dot.ok{background:var(--ok); box-shadow:0 0 10px #34d39980}
.dot.bad{background:var(--err); box-shadow:0 0 10px #f8717180}
.dot.busy{background:var(--warn); animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
button, select, textarea{font-family:inherit; font-size:inherit; color:inherit}
.btn{
  border:1px solid var(--stroke); background:#0d1322; color:var(--txt);
  padding:7px 13px; border-radius:10px; cursor:pointer; font-size:13px; transition:.15s;
}
.btn:hover{background:#131b2e; border-color:#2a3757}
.btn.primary{
  background:linear-gradient(135deg,var(--cyan),var(--violet)); border:0; color:#04060c; font-weight:650;
  box-shadow:0 6px 18px -8px var(--violet);
}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
/* ---------- layout ---------- */
main{flex:1; display:flex; min-height:0}
aside{
  width:264px; flex:0 0 auto; border-right:1px solid var(--stroke); background:#070a13aa;
  padding:14px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;
}
.side-h{font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--dim-2); margin:0 0 7px}
select{
  width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--stroke);
  background:#0a1020; color:var(--txt);
}
.chip{
  display:block; width:100%; text-align:left; padding:8px 10px; margin-bottom:6px; font-size:12.5px;
  border-radius:10px; border:1px solid #171f36; background:#080d18; color:var(--dim); cursor:pointer;
  transition:.15s; line-height:1.35;
}
.chip:hover{border-color:#2a3757; color:var(--txt); background:#0d1526; transform:translateX(2px)}
.row{display:flex; gap:8px; align-items:center}
.switch{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--dim); gap:8px}
input[type=checkbox]{accent-color:var(--cyan); width:15px; height:15px}
/* ---------- chat ---------- */
section.chat{flex:1; display:flex; flex-direction:column; min-width:0}
#scroll{flex:1; overflow-y:auto; padding:26px 8%; scroll-behavior:smooth}
#scroll::-webkit-scrollbar,aside::-webkit-scrollbar{width:9px}
#scroll::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb{background:#1b2438; border-radius:9px}
.msg{display:flex; gap:13px; margin-bottom:22px; animation:rise .22s ease-out}
@keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.avatar{
  width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center;
  font-size:12px; font-weight:700; border:1px solid var(--stroke);
}
.avatar.user{background:#101a2e; color:var(--dim)}
.avatar.bot{background:linear-gradient(135deg,#0e2b3a,#1a1140); border-color:#253155; color:var(--cyan)}
.bubble{min-width:0; flex:1}
.who{font-size:11.5px; color:var(--dim-2); margin-bottom:4px; letter-spacing:.3px}
.body{line-height:1.62; font-size:14.6px; word-wrap:break-word}
.body p{margin:0 0 10px}
.body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3{font-size:15.5px; margin:16px 0 7px; color:#fff}
.body ul,.body ol{margin:6px 0 10px; padding-left:22px}
.body li{margin:3px 0}
.body code{
  font-family:var(--mono); font-size:12.8px; background:#111a2c; padding:1.5px 5px;
  border-radius:5px; border:1px solid #1d2942; color:#9fe8f7;
}
.codeblock{position:relative; margin:10px 0}
.codeblock pre{
  margin:0; padding:13px 14px; background:#060a13; border:1px solid var(--stroke);
  border-radius:11px; overflow-x:auto; font-family:var(--mono); font-size:12.7px; line-height:1.55;
}
.codeblock .cp{
  position:absolute; top:7px; right:7px; font-size:11px; padding:4px 8px; border-radius:7px;
  border:1px solid #243052; background:#0c1424; color:var(--dim); cursor:pointer; opacity:0; transition:.15s;
}
.codeblock:hover .cp{opacity:1}
.body a{color:var(--cyan)}
.body strong{color:#fff}
.tool-card{
  border:1px solid #24304e; border-left:3px solid var(--cyan); background:#080e1b;
  border-radius:10px; padding:9px 12px; margin:10px 0; font-size:12.5px; color:var(--dim);
}
.tool-card b{color:var(--cyan); font-weight:600}
.tool-card pre{
  margin:8px 0 0; max-height:190px; overflow:auto; font-family:var(--mono); font-size:11.6px;
  color:#93a1c4; background:#050911; padding:9px; border-radius:7px; white-space:pre-wrap;
}
/* welcome */
.welcome{max-width:640px; margin:6vh auto; text-align:center}
.welcome svg.mark{width:76px; height:76px; filter:drop-shadow(0 0 26px #22d3ee55); margin-bottom:6px}
.welcome h1{font-size:25px; margin:8px 0 6px; letter-spacing:-.4px}
.welcome p{color:var(--dim); margin:0 auto 20px; font-size:14px; max-width:460px; line-height:1.6}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:9px; text-align:left}
.card{
  border:1px solid var(--stroke); background:#080d18cc; border-radius:12px; padding:12px 13px;
  cursor:pointer; transition:.16s;
}
.card:hover{border-color:#2f3f66; background:#0c1526; transform:translateY(-1px)}
.card b{display:block; font-size:13px; margin-bottom:3px; color:#dfe7fb}
.card span{font-size:12px; color:var(--dim-2); line-height:1.45}
/* composer */
.composer{flex:0 0 auto; padding:12px 8% 20px; background:linear-gradient(to top,#05070d 55%,transparent)}
.inputwrap{
  display:flex; gap:10px; align-items:flex-end; border:1px solid var(--stroke);
  background:#0a0f1ccc; border-radius:16px; padding:9px 9px 9px 14px; transition:.18s;
  box-shadow:0 10px 34px -22px #000;
}
.inputwrap:focus-within{border-color:#2c6d80; box-shadow:0 0 0 3px #22d3ee14}
textarea{
  flex:1; resize:none; border:0; outline:0; background:transparent; max-height:190px;
  min-height:24px; line-height:1.55; font-size:14.5px; padding:5px 0;
}
.hint{text-align:center; font-size:11.5px; color:#3f4864; margin-top:8px}
.hint kbd{font-family:var(--mono); background:#0d1424; border:1px solid #1c2540; border-radius:4px; padding:1px 5px}
/* banner */
#banner{display:none; margin:0 8% 10px; padding:11px 14px; border-radius:12px; font-size:13px;
  border:1px solid #4b3a12; background:#1a1408; color:#f7d994}
#banner b{color:#ffd977}
#banner .btn{margin-left:10px; padding:5px 10px; font-size:12px}
.progress{height:5px; background:#152036; border-radius:9px; overflow:hidden; margin-top:9px}
.progress > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--violet)); transition:width .3s}
.typing::after{content:'▍'; color:var(--cyan); animation:pulse 1s steps(2) infinite; margin-left:1px}
@media (max-width:820px){ aside{display:none} #scroll{padding:18px 5%} .composer{padding:10px 5% 16px} .cards{grid-template-columns:1fr} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <path d="M18 16h44l20 22-12 13H46l-9-10h30l3-3-11-12H18z" fill="url(#rg)"/>
      <path d="M18 55h16v29H18z" fill="url(#rg)"/>
      <path d="M40 55h16l14 29H54z" fill="url(#rg)"/>
    </svg>
    <span>Razef Assistant</span>
    <span class="sub">local · offline</span>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="engine">checking engine…</span></div>
  <button class="btn" id="newchat" title="Start a new conversation">New chat</button>
</header>

<main>
  <aside>
    <div>
      <p class="side-h">Model</p>
      <select id="model"></select>
      <p class="hint" id="modelhint" style="text-align:left;margin:7px 0 0">Runs on this machine.</p>
    </div>

    <div>
      <p class="side-h">Quick actions</p>
      <button class="chip" data-q="My game is running slow. Check my GPU driver and tell me what to tune.">Diagnose low FPS</button>
      <button class="chip" data-q="My controller is not detected in Steam. Check the input devices and help me fix it.">Controller not detected</button>
      <button class="chip" data-q="Check my disk usage and failed services, then summarize what is wrong.">Health check</button>
      <button class="chip" data-q="What is the correct way to install an app on Razef OS?">How do I install apps?</button>
      <button class="chip" data-q="Show me the best MangoHud settings for a 144Hz monitor and explain each option.">MangoHud tuning</button>
    </div>

    <div>
      <p class="side-h">Behaviour</p>
      <label class="switch"><span>Allow system diagnostics</span><input type="checkbox" id="tools" checked></label>
      <label class="switch" style="margin-top:9px"><span>Show tool output</span><input type="checkbox" id="showtools" checked></label>
    </div>

    <div style="margin-top:auto; font-size:11px; color:#3f4864; line-height:1.5">
      Razef Assistant runs entirely on this machine. Nothing you type leaves it.
    </div>
  </aside>

  <section class="chat">
    <div id="banner"></div>
    <div id="scroll"></div>
    <div class="composer">
      <div class="inputwrap">
        <textarea id="input" rows="1" placeholder="Ask about your system, games, drivers…"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div>
    </div>
  </section>
</main>

<script>
(() => {
"use strict";

const $ = (s) => document.querySelector(s);
const scroll = $("#scroll"), input = $("#input"), sendBtn = $("#send");
const modelSel = $("#model"), dot = $("#dot"), engine = $("#engine"), banner = $("#banner");

let history = [];          // [{role, content}]
let busy = false;
let abortCtl = null;
let PREVIEW_ONCE = false;

/* When this file is opened outside the Razef backend (file:// preview, design
   review, docs screenshot) we mock the API so the UI stays explorable.
   In production this is always false. */
let PREVIEW = location.protocol === "file:" ||
              location.protocol === "blob:" ||
              location.search.includes("preview");

/* ---------------- markdown-lite ---------------- */
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function md(src){
  const blocks = [];
  let text = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.push({lang, code}) - 1;
    return `\u0000BLOCK${i}\u0000`;
  });

  text = esc(text);

  text = text
    .replace(/^###\s+(.*)$/gm, "<h3>$1</h3>")
    .replace(/^##\s+(.*)$/gm, "<h2>$1</h2>")
    .replace(/^#\s+(.*)$/gm, "<h1>$1</h1>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');

  // lists
  const lines = text.split("\n");
  const out = [];
  let list = null;
  for (const line of lines){
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol){
      const tag = ul ? "ul" : "ol";
      if (list !== tag){ if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
      out.push(`<li>${(ul ? ul[1] : ol[1])}</li>`);
    } else {
      if (list){ out.push(`</${list}>`); list = null; }
      out.push(line);
    }
  }
  if (list) out.push(`</${list}>`);

  text = out.join("\n")
    .replace(/\n{2,}/g, "</p><p>")
    .replace(/\n/g, "<br>");
  text = "<p>" + text + "</p>";
  text = text.replace(/<p>\s*(<h[123]>)/g, "$1").replace(/(<\/h[123]>)\s*<\/p>/g, "$1");
  text = text.replace(/<p>\s*(<(?:ul|ol)>)/g, "$1").replace(/(<\/(?:ul|ol)>)\s*<\/p>/g, "$1");
  text = text.replace(/\u0000BLOCK(\d+)\u0000/g, (_, i) => {
    const b = blocks[+i];
    return `<div class="codeblock"><button class="cp">copy</button><pre><code>${esc(b.code.replace(/\n$/,""))}</code></pre></div>`;
  });
  return text;
}

/* ---------------- rendering ---------------- */
function addMessage(role, text){
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = `
    <div class="avatar ${role === "user" ? "user" : "bot"}">${role === "user" ? "YOU" : "R"}</div>
    <div class="bubble">
      <div class="who">${role === "user" ? "You" : "Razef Assistant"}</div>
      <div class="body ${role === "assistant" ? "typing" : ""}"></div>
    </div>`;
  const body = wrap.querySelector(".body");
  body.innerHTML = role === "user" ? `<p>${esc(text)}</p>` : "";
  scroll.appendChild(wrap);
  scroll.scrollTop = scroll.scrollHeight;
  return body;
}

function addTool(name, desc, output){
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = `
    <div class="avatar bot">⚙</div>
    <div class="bubble"><div class="tool-card">
      <b>${esc(name)}</b> — ${esc(desc || "diagnostic")}
      <pre>${esc(output || "running…")}</pre>
    </div></div>`;
  if (!output) wrap.querySelector("pre").textContent = "running…";
  scroll.appendChild(wrap);
  scroll.scrollTop = scroll.scrollHeight;
  return wrap;
}

function welcome(){
  scroll.innerHTML = `
  <div class="welcome">
    <svg class="mark" viewBox="0 0 100 100">
      <defs><linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      <path d="M18 16h44l20 22-12 13H46l-9-10h30l3-3-11-12H18z" fill="url(#rg2)"/>
      <path d="M18 55h16v29H18z" fill="url(#rg2)"/>
      <path d="M40 55h16l14 29H54z" fill="url(#rg2)"/>
    </svg>
    <h1>What are we fixing today?</h1>
    <p>I run on this machine and I can look at your hardware, services and logs.
       Ask in plain language — I'll check the real state of your system before answering.</p>
    <div class="cards">
      <div class="card" data-q="My game is running slow. Check my GPU driver and tell me what to tune.">
        <b>Diagnose low FPS</b><span>GPU driver, Mesa state, loaded modules</span></div>
      <div class="card" data-q="My controller is not detected in Steam. Check the input devices and help me fix it.">
        <b>Controller not detected</b><span>USB devices, uinput, Steam Input</span></div>
      <div class="card" data-q="Check my disk usage and failed services, then summarize what is wrong.">
        <b>System health check</b><span>Failed units, journal errors, disk</span></div>
      <div class="card" data-q="What is the correct way to install an app on Razef OS?">
        <b>Immutability 101</b><span>Flatpak vs rpm-ostree vs Homebrew</span></div>
    </div>
  </div>`;
}

/* ---------------- api ---------------- */
async function status(){
  if (PREVIEW){
    dot.className = "dot ok";
    engine.textContent = "preview mode";
    modelSel.innerHTML = "";
    for (const m of ["qwen3:4b · 4b", "qwen3:8b · 8b", "llama3.2:3b · 3b"]){
      const o = document.createElement("option");
      o.value = m.split(" ")[0]; o.textContent = m;
      modelSel.appendChild(o);
    }
    return {preview:true};
  }
  try{
    const r = await fetch("/api/status");
    const s = await r.json();
    dot.className = "dot " + (s.ollama ? "ok" : "bad");
    engine.textContent = s.ollama ? "engine ready" : "engine offline";

    modelSel.innerHTML = "";
    if (!s.models.length){
      const o = document.createElement("option");
      o.textContent = "no model installed";
      o.value = "";
      modelSel.appendChild(o);
      showBanner(`<b>No model installed yet.</b> Razef Assistant needs a local model before it can answer.
        <button class="btn primary" id="pullDefault">Download ${esc(s.default_model)}</button>
        <div class="progress" id="prog" hidden><i></i></div>`);
      const b = $("#pullDefault");
      if (b) b.onclick = () => pull(s.default_model);
    } else {
      for (const m of s.models){
        const o = document.createElement("option");
        o.value = m.name;
        o.textContent = `${m.name} · ${(m.params || "").toLowerCase()}`;
        modelSel.appendChild(o);
      }
      if (s.models.some(m => m.name === s.default_model)) modelSel.value = s.default_model;
      hideBannerIfModelMissing();
    }
    if (!s.ollama){
      showBanner(`<b>The local engine is not running.</b> Start it with
        <code>sudo systemctl enable --now ollama</code> and refresh this window.`);
    }
    return s;
  }catch(e){
    dot.className = "dot bad"; engine.textContent = "backend offline";
    // If the backend has never answered, show the interface in preview mode so
    // the window is still useful. The banner keeps the real fix visible.
    if (!PREVIEW_ONCE){
      PREVIEW_ONCE = true; PREVIEW = true;
      dot.className = "dot bad";
      engine.textContent = "preview · backend offline";
      modelSel.innerHTML = "";
      for (const m of ["qwen3:4b", "qwen3:8b"]){
        const o = document.createElement("option");
        o.value = m; o.textContent = m;
        modelSel.appendChild(o);
      }
    }
    showBanner(`<b>The assistant service is not reachable.</b> Start it with
      <code>systemctl --user start razef-assist</code> — this window keeps
      working in preview mode until then.`);
    return null;
  }
}

function showBanner(html){ banner.innerHTML = html; banner.style.display = "block"; }
function hideBannerIfModelMissing(){ banner.style.display = "none"; }

async function pull(model){
  const prog = $("#prog");
  if (prog) prog.hidden = false;
  const bar = prog ? prog.querySelector("i") : null;
  try{
    const r = await fetch("/api/pull", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({model})
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx+1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "progress" && bar && ev.total){
          const pct = Math.min(100, (ev.completed / ev.total) * 100);
          bar.style.width = pct.toFixed(1) + "%";
          const msg = banner.querySelector("#pullmsg");
          if (msg) msg.textContent = `${ev.status} ${pct.toFixed(0)}%`;
        }
        if (ev.type === "done"){ await status(); }
        if (ev.type === "error"){ showBanner(`<b>Download failed:</b> ${esc(ev.error)}`); }
      }
    }
  }catch(e){
    showBanner(`<b>Download failed:</b> ${esc(String(e))}`);
  }
}

/* ---------------- streaming chat ---------------- */
const PREVIEW_REPLY = {
  tool: {name:"gpu_driver", desc:"NVIDIA / Mesa driver state and loaded graphics modules"},
  toolOut: `nvidia-smi not present (AMD/Intel or driver missing)
--- modules ---
amdgpu              12345678  45
--- mesa ---
mesa-dri-drivers-25.1.4-1.fc44.x86_64`,
  text: `Your driver stack looks healthy - **amdgpu** is loaded and Mesa 25.1.4 is the shipping version. So the frames are being thrown away somewhere else.

### What to check, in order

1. **Is the game actually using the GPU?** Run it through gamescope and watch the OSD:
   \`\`\`
   gamescope -f -- %command%
   \`\`\`
2. **Frame limiter + compositor sync.** A 144 Hz panel with an unlocked frame rate will burn power for nothing. Cap slightly below refresh:
   \`\`\`
   MANGOHUD_CONFIG=fps_limit=141 mangohud %command%
   \`\`\`
3. **GameMode.** Razef ships it; make sure the launch option is there:
   \`\`\`
   gamemoderun mangohud %command%
   \`\`\`
4. **Shader cache.** First launch after a Mesa update is always slow - let it finish once before judging.

If \`gamescope\` shows the GPU pinned at 99% while FPS is low, it is a Proton/translation issue, not a driver issue. Tell me the game and I'll check the ProtonDB notes.`
};

async function previewChat(text){
  busy = true; sendBtn.disabled = true;
  const w = document.querySelector("#scroll .welcome"); if (w) scroll.innerHTML = "";
  addMessage("user", text);
  const body = addMessage("assistant", "");
  await new Promise(r => setTimeout(r, 350));

  const card = addTool(PREVIEW_REPLY.tool.name, PREVIEW_REPLY.tool.desc, "");
  await new Promise(r => setTimeout(r, 700));
  card.querySelector("pre").textContent = PREVIEW_REPLY.toolOut;
  body.classList.add("typing");

  const full = PREVIEW_REPLY.text;
  for (let i = 0; i < full.length; i += 4){
    body.innerHTML = md(full.slice(0, i + 4));
    scroll.scrollTop = scroll.scrollHeight;
    await new Promise(r => setTimeout(r, 8));
  }
  body.classList.remove("typing");
  body.querySelectorAll(".cp").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(b.parentElement.querySelector("code").textContent);
    b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200);
  });
  busy = false; sendBtn.disabled = false;
}

async function chat(text){
  if (busy) return;
  if (PREVIEW) return previewChat(text);
  busy = true; sendBtn.disabled = true;

  const w = $("#scroll .welcome"); if (w) $("#scroll").innerHTML = "";

  addMessage("user", text);
  history.push({role:"user", content:text});

  const body = addMessage("assistant", "");
  let raw = "";
  abortCtl = new AbortController();

  try{
    const r = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: abortCtl.signal,
      body: JSON.stringify({
        model: modelSel.value,
        messages: history,
        tools: $("#tools").checked
      })
    });

    if (!r.ok){
      const e = await r.json().catch(()=>({error:"request failed"}));
      body.classList.remove("typing");
      body.innerHTML = `<p style="color:var(--err)">${esc(e.error || "request failed")}</p>`;
      if (e.hint) body.innerHTML += `<p style="color:var(--dim)">${esc(e.hint)}</p>`;
      return;
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx+1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }

        if (ev.type === "token"){
          raw += ev.text;
          body.innerHTML = md(raw);
          scroll.scrollTop = scroll.scrollHeight;
        } else if (ev.type === "reset_text"){
          raw = "";
          body.innerHTML = "";
        } else if (ev.type === "tool"){
          const desc = ev.desc || "";
          body.classList.remove("typing");
          const card = addTool(ev.name, desc, "");
          card.dataset.pending = "1";
        } else if (ev.type === "tool_result"){
          const pending = scroll.querySelector('.tool-card[data-pending]');
          if (pending){
            pending.removeAttribute("data-pending");
            pending.querySelector("pre").textContent = $("#showtools").checked
              ? ev.output : "(output hidden — " + ev.output.split("\n").length + " lines)";
          }
          body.classList.add("typing");
        } else if (ev.type === "error"){
          body.classList.remove("typing");
          body.innerHTML += `<p style="color:var(--err)">${esc(ev.error)}</p>`;
        } else if (ev.type === "done"){
          body.classList.remove("typing");
        }
      }
    }
  }catch(e){
    if (e.name !== "AbortError"){
      body.classList.remove("typing");
      body.innerHTML += `<p style="color:var(--err)">${esc(String(e))}</p>`;
    }
  }finally{
    body.classList.remove("typing");
    body.querySelectorAll(".cp").forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(b.parentElement.querySelector("code").textContent);
      b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200);
    });
    if (raw.trim()) history.push({role:"assistant", content:raw});
    busy = false; sendBtn.disabled = false; abortCtl = null;
    scroll.scrollTop = scroll.scrollHeight;
  }
}

/* ---------------- events ---------------- */
function submit(){
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; input.style.height = "auto";
  chat(text);
}

sendBtn.onclick = submit;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 190) + "px";
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-q]");
  if (t && !busy){ input.value = t.dataset.q; submit(); }
  const cp = e.target.closest(".cp");
  if (cp){
    navigator.clipboard.writeText(cp.parentElement.querySelector("code").textContent);
    cp.textContent = "copied"; setTimeout(() => cp.textContent = "copy", 1200);
  }
});
$("#newchat").onclick = () => {
  if (busy && abortCtl) abortCtl.abort();
  history = []; welcome(); status();
};
$("#showtools").onchange = () => {};

/* boot */
welcome();
status();
if (!PREVIEW) setInterval(() => { if (!busy) status(); }, 20000);
input.focus();
})();
</script>
