---
# ===========================================================================
# Razef OS build — v4  (last one, promise)
#
# Replaces the contents of  .github/workflows/build.yml
#
# HISTORY, so we stop repeating mistakes:
#   v1  exit 125 in 2m29s  - build_files/build.sh had no exec bit
#   v2  exit 125 in 0s     - used podman flags that the runner's podman
#                            (4.x) does not have: --logfile / --security-opt
#   v3  exit 125 in 0s     - used `podman pull --retry`, also 5.x-only
#
# v4 RULE: only flags that exist in BOTH podman 4.x and 5.x.
#     podman pull          (no flags; retries done with a bash loop)
#     podman build --pull=missing --build-arg -t -f <ctx>
#     podman push, podman login, podman tag, podman image exists
#   Logging is done with `tee`, never with --logfile.
# ===========================================================================
name: Build Razef OS image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razef-os
            base: ghcr.io/ublue-os/bazzite-gnome:stable
          - image: razef-os-nvidia
            base: ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
            /opt/az /opt/pipx /opt/google /usr/local/share/boost \
            /usr/lib/jvm 2>/dev/null || true
          podman system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Fix file modes
        run: |
          set -x
          chmod +x razef-os/build_files/build.sh || true
          chmod +x razef-os/scripts/*.sh 2>/dev/null || true
          chmod +x razef-os/system_files/overrides/usr/bin/* 2>/dev/null || true
          ls -l razef-os/build_files/build.sh

      - name: Preflight
        run: |
          set -x
          podman --version
          df -h /
          test -f razef-os/Containerfile || { echo "::error title=Missing Containerfile::razef-os/Containerfile not found"; exit 1; }
          test -d razef-os/build_files || { echo "::error title=Missing build_files::razef-os/build_files not found"; exit 1; }
          # Remove the BuildKit frontend directive: it would make podman fetch a
          # helper image from Docker Hub, which gets rate limited on runners.
          # Not needed - podman's builtin parser handles this Containerfile.
          sed -i '/^# syntax=/d' razef-os/Containerfile
          head -2 razef-os/Containerfile

      - name: Pull base image
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -x
          # `podman pull --retry` only exists in podman 5.x, so retry manually.
          for attempt in 1 2 3; do
            if podman pull "${BASE}"; then
              echo "pulled ${BASE} (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error title=Pull failed::could not pull ${BASE} after 3 attempts"
              exit 1
            fi
            echo "attempt ${attempt} failed - retrying in 20s"
            sleep 20
          done
          podman image exists "${BASE}" || {
            echo "::error title=Pull failed::${BASE} is not in local storage"
            exit 1
          }

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          set -x
          podman build \
            --pull=missing \
            --build-arg BASE_IMAGE="${BASE}" \
            --tag "localhost/${IMAGE}:stable" \
            --file razef-os/Containerfile \
            razef-os 2>&1 | tee "build-${IMAGE}.log"

      - name: Report failure
        if: failure()
        run: |
          LOG="build-${{ matrix.image }}.log"
          {
            echo "## ❌ Build failed: ${{ matrix.image }}"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -nE 'Error|error:|denied|No space|not found|cannot|unable|failed|unknown flag' "$LOG" | tail -n 20 || true
              echo "----- last 25 lines -----"
              tail -n 25 "$LOG" || true
            else
              echo "No build log: podman refused to start. Likely an unknown"
              echo "flag for this podman version - see the step above."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR="$(grep -hE 'Error|error:|unknown flag' "$LOG" 2>/dev/null | tail -n 2 | tr '\n' ' ' | cut -c1-600)"
          echo "::error title=Build failed (${{ matrix.image }})::${ERR:-no log produced}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image }}
          path: build-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Log in to GHCR
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: success()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/${OWNER}/${IMAGE}:stable"
          podman tag "localhost/${IMAGE}:stable" "${TARGET}"
          podman push "${TARGET}"
          echo "✅ pushed ${TARGET}"
          echo "### ✅ \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
