---
# ===========================================================================
# Razef OS build — v3
#
# Replaces the whole contents of  .github/workflows/build.yml  in your repo.
#
# WHY v1 AND v2 FAILED
#   Both died in 0 seconds with exit code 125 and produced no build log, i.e.
#   podman refused to start building. The cause is line 1 of the Containerfile:
#
#       # syntax=docker/dockerfile:1
#
#   That directive makes podman download a helper "frontend" image from
#   DOCKER HUB before it parses anything. GitHub's runners share IP addresses,
#   so anonymous Docker Hub pulls are frequently throttled
#   ("toomanyrequests: You have reached your pull rate limit") -> instant 125.
#   It is also the ONLY thing in the whole build that does not come from
#   ghcr.io. The Containerfile does not need it: podman understands every
#   instruction we use (FROM scratch, COPY, RUN --mount=type=bind/cache/tmpfs)
#   with its built-in parser.
#
# WHAT v3 DOES
#   1. deletes that directive before building (no repo edit needed)
#   2. prints a preflight (podman version, files found, free disk) so a
#      failure is never invisible again
#   3. pre-pulls the base image with 5 retries
#   4. builds with the full output tee'd to build.log
#   5. on failure, puts the REAL error in the run summary + uploads the log
# ===========================================================================
name: Build Razef OS image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razef-os
            base: ghcr.io/ublue-os/bazzite-gnome:stable
          - image: razef-os-nvidia
            base: ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
            /opt/az /opt/pipx /opt/google /usr/local/share/boost \
            /usr/lib/jvm 2>/dev/null || true
          podman system prune -af >/dev/null 2>&1 || true
          df -h /

      # ---------------------------------------------------------------------
      # FILE MODES: GitHub's web uploader strips the executable bit.
      # ---------------------------------------------------------------------
      - name: Fix file modes
        run: |
          set -x
          chmod +x razef-os/build_files/build.sh || true
          chmod +x razef-os/scripts/*.sh 2>/dev/null || true
          chmod +x razef-os/system_files/overrides/usr/bin/* 2>/dev/null || true
          ls -l razef-os/build_files/build.sh

      # ---------------------------------------------------------------------
      # PREFLIGHT: proves the files are where we think they are, and removes
      # the Docker Hub dependency from line 1 of the Containerfile.
      # ---------------------------------------------------------------------
      - name: Preflight
        run: |
          set -x
          podman --version
          df -h /
          ls -la razef-os | head -20
          test -f razef-os/Containerfile || { echo "::error title=Containerfile missing::razef-os/Containerfile not found in the checkout"; exit 1; }
          test -d razef-os/build_files || { echo "::error title=build_files missing::razef-os/build_files not found"; exit 1; }
          echo "--- Containerfile head (before) ---"; head -3 razef-os/Containerfile
          # drop the BuildKit frontend directive: it pulls from Docker Hub,
          # and Docker Hub throttles GitHub runners
          sed -i '/^# syntax=/d' razef-os/Containerfile
          echo "--- Containerfile head (after) ---"; head -3 razef-os/Containerfile
          grep -q 'syntax=' razef-os/Containerfile && { echo "::error::frontend directive still present"; exit 1; } || echo "OK: no Docker Hub dependency"

      # ---------------------------------------------------------------------
      # Pull the base image separately so a pull problem cannot be mistaken
      # for a build problem.
      # ---------------------------------------------------------------------
      - name: Pull base image
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -x
          podman pull --retry 5 --retry-delay 10 "${BASE}"
          podman images "${BASE}"

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          set -x
          podman build \
            --pull=missing \
            --build-arg BASE_IMAGE="${BASE}" \
            --tag "localhost/${IMAGE}:stable" \
            --file razef-os/Containerfile \
            razef-os 2>&1 | tee "build-${IMAGE}.log"

      # ---------------------------------------------------------------------
      # Make any failure readable in one glance.
      # ---------------------------------------------------------------------
      - name: Report failure
        if: failure()
        run: |
          LOG="build-${{ matrix.image }}.log"
          {
            echo "## ❌ Build failed: ${{ matrix.image }}"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -nE 'Error|error:|denied|No space|not found|cannot|unable|failed' "$LOG" | tail -n 15 || true
              echo "----- last 25 lines -----"
              tail -n 25 "$LOG" || true
            else
              echo "No build log was produced - podman refused to start."
              echo "That means an argument, a missing path, or a pull of a"
              echo "helper image was rejected before the build began."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          ERR="$(grep -hE 'Error|error:' "$LOG" 2>/dev/null | tail -n 2 | tr '\n' ' ' | cut -c1-600)"
          echo "::error title=Build failed (${IMAGE:-${{ matrix.image }}})::${ERR:-no log produced}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image }}
          path: build-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 5

      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: success()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/${OWNER}/${IMAGE}:stable"
          podman tag "localhost/${IMAGE}:stable" "${TARGET}"
          podman push "${TARGET}"
          echo "✅ pushed ${TARGET}"
          echo "### ✅ \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
