---
# ===========================================================================
# Razef OS build — v2
#
# Replaces the contents of  .github/workflows/build.yml  in your repo.
#
# What changed vs v1 (which failed in 2 min with exit code 125):
#   * fixes the missing executable bit on build_files/build.sh, which the
#     GitHub web uploader strips  (this is what killed the build)
#   * frees ~30 GB of runner disk instead of ~10 GB (the Bazzite base image
#     needs a lot of room)
#   * captures the full build log and, if it fails, prints the real error as
#     an annotation so it can be read at a glance
#   * uploads build.log as an artifact on failure
#
# Layout assumed: the Razef files live in a folder called  razef-os/  at the
# repository root (which is how your repo is organised right now).
# ===========================================================================
name: Build Razef OS image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razef-os
            base: ghcr.io/ublue-os/bazzite-gnome:stable
          - image: razef-os-nvidia
            base: ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # The runner starts with a big toolchain we don't need. Free it, then
      # show how much room we actually have.
      # ---------------------------------------------------------------------
      - name: Free disk space
        run: |
          set -euxo pipefail
          echo "=== before ==="; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/share/swift \
            /opt/az /opt/pipx /opt/google \
            /usr/local/share/boost \
            /usr/lib/jvm 2>/dev/null || true
          sudo podman system prune -af --volumes 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          echo "=== after ==="; df -h /

      # ---------------------------------------------------------------------
      # GitHub's web UI throws away file permissions. Without this the build
      # dies with "Permission denied" (podman exit code 125).
      # ---------------------------------------------------------------------
      - name: Fix file modes stripped by the GitHub uploader
        run: |
          set -x
          chmod +x razef-os/build_files/build.sh || true
          chmod +x razef-os/scripts/*.sh 2>/dev/null || true
          chmod +x razef-os/system_files/overrides/usr/bin/* 2>/dev/null || true
          ls -l razef-os/build_files/build.sh razef-os/system_files/overrides/usr/bin/

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BASE: ${{ matrix.base }}
        run: |
          echo "Building ${IMAGE} from ${BASE}"
          podman build \
            --pull=newer \
            --logfile "${GITHUB_WORKSPACE}/build-${IMAGE}.log" \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${BASE}" \
            --tag "localhost/${IMAGE}:stable" \
            --file razef-os/Containerfile \
            razef-os

      # If the build failed, surface the actual reason as an annotation.
      - name: Show build error
        if: failure()
        run: |
          LOG="${GITHUB_WORKSPACE}/build-${{ matrix.image }}.log"
          if [ -f "$LOG" ]; then
            echo "=== last 40 lines of the build log ==="
            tail -n 40 "$LOG" || true
            ERROR="$(grep -iE 'error:|permission denied|no space left|not found|cannot' "$LOG" | tail -n 3 | tr '\n' ' ' | cut -c1-800)"
            echo "::error title=Build failed::${ERROR:-see the log artifact below}"
          else
            echo "::error title=Build failed::podman produced no log file"
          fi
          df -h / || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image }}
          path: build-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 5

      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: success()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/${OWNER}/${IMAGE}:stable"
          podman tag "localhost/${IMAGE}:stable" "${TARGET}"
          podman push "${TARGET}"
          echo "✅ pushed ${TARGET}"
          echo "### ✅ \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
