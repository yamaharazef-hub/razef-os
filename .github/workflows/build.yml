---
# ===========================================================================
# Razef OS build — v9
# Replaces the contents of  .github/workflows/build.yml
#
# Failure history (every one was a real, separate bug):
#   v1   2m29s  build_files/build.sh had no executable bit
#   v2   0s     --logfile / --security-opt are podman 5.x only
#   v3   0s     `podman pull --retry` is podman 5.x only
#   v4   ~1m    ARG BASE_IMAGE declared after the first FROM
#   v5   ~9m    Ollama moved from .tgz to .tar.zst (old URL 404)
#   v6   ~12m   dracut: "ERROR: installing '/root'" (/root -> /var/root)
#   v7   ~40s   my "outdated build.sh" guard false-fired on the .tgz fallback
#   v8   ~13m   dracut finished, but the splash theme was not in the initramfs:
#               dracut only installs the plymouth theme reported by
#               `plymouth-set-default-theme`, and only in hostonly mode, which
#               a --no-hostonly (distributable) image never takes
#
# v9
#   * repair step now also writes /etc/dracut.conf.d/99-razef-plymouth.conf
#     with install_items for the theme + the two-step plugin, and passes
#     --no-hostonly to dracut (correct for a redistributable image)
#   * verify step asserts all three patches really landed, so it fails in
#     seconds instead of after a 13-minute build
#   * you still do NOT need to upload any file
# ===========================================================================
name: Build Razef OS image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razef-os
            base: ghcr.io/ublue-os/bazzite-gnome:stable
            cuda: 0
          - image: razef-os-nvidia
            base: ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable
            cuda: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
            /opt/az /opt/pipx /opt/google /usr/local/share/boost \
            /usr/lib/jvm 2>/dev/null || true
          podman system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Fix file modes
        run: |
          set -x
          chmod +x razef-os/build_files/build.sh || true
          chmod +x razef-os/scripts/*.sh 2>/dev/null || true
          chmod +x razef-os/system_files/overrides/usr/bin/* 2>/dev/null || true
          ls -l razef-os/build_files/build.sh

      - name: Repair Containerfile
        run: |
          set -x
          test -f razef-os/Containerfile || { echo "::error title=Missing Containerfile::razef-os/Containerfile not found"; exit 1; }
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path("razef-os/Containerfile")
          lines = p.read_text().splitlines()

          before = len(lines)
          lines = [l for l in lines if not l.lstrip().startswith("# syntax=")]
          if len(lines) != before:
              print("removed the BuildKit frontend directive")

          # 1. ARG BASE_IMAGE must be declared before the first FROM
          args = [l for l in lines if re.match(r"^ARG\s+BASE_IMAGE", l)]
          if not args:
              args = ['ARG BASE_IMAGE="ghcr.io/ublue-os/bazzite-gnome:stable"']
          lines = [l for l in lines if not re.match(r"^ARG\s+BASE_IMAGE", l)]
          first_from = next((i for i, l in enumerate(lines) if l.startswith("FROM")), None)
          if first_from is None:
              sys.exit("ERROR: the Containerfile has no FROM at all")
          lines[first_from:first_from] = args + [""]
          print("hoisted:", args[0])

          # 2. the -nvidia image needs WITH_CUDA forwarded into build.sh, or it silently
          #    builds the plain CPU image (build.sh gates the CUDA download on it).
          if not any(re.match(r"^ARG\s+WITH_CUDA", l) for l in lines):
              anchors = [i for i, l in enumerate(lines) if re.match(r"^ARG\s+", l)]
              lines.insert(max(anchors) + 1, 'ARG WITH_CUDA="0"')
              print("added ARG WITH_CUDA")
          if not any('WITH_CUDA="${WITH_CUDA}"' in l for l in lines):
              anchors = [i for i, l in enumerate(lines) if l.strip().startswith("WITH_DEV_TOOLS=")]
              lines.insert(max(anchors) + 1, '    WITH_CUDA="${WITH_CUDA}" \\')
              print("forwarded WITH_CUDA into the build script")

          # 3. invoke the script through bash so a lost exec bit cannot break the build
          for i, l in enumerate(lines):
              if l.strip() == "/ctx/build_files/build.sh":
                  lines[i] = "    bash /ctx/build_files/build.sh"
                  print("build.sh is now executed via bash")

          p.write_text("\n".join(lines) + "\n")
          PY

          ARG_LINE=$(grep -n '^ARG BASE_IMAGE' razef-os/Containerfile | head -1 | cut -d: -f1)
          FROM_LINE=$(grep -n '^FROM' razef-os/Containerfile | head -1 | cut -d: -f1)
          echo "ARG BASE_IMAGE on line ${ARG_LINE}, first FROM on line ${FROM_LINE}"
          [ -n "${ARG_LINE}" ] && [ "${ARG_LINE}" -lt "${FROM_LINE}" ] || {
            echo "::error title=Containerfile repair failed::ARG BASE_IMAGE must come before the first FROM"; exit 1; }
          grep -q '^ARG WITH_CUDA=' razef-os/Containerfile || { echo "::error title=Containerfile repair failed::ARG WITH_CUDA missing"; exit 1; }
          grep -q 'WITH_CUDA="\${WITH_CUDA}"' razef-os/Containerfile || { echo "::error title=Containerfile repair failed::WITH_CUDA is not forwarded"; exit 1; }
          grep -q 'bash /ctx/build_files/build.sh' razef-os/Containerfile || { echo "::error title=Containerfile repair failed::build.sh is not run via bash"; exit 1; }
          echo "Containerfile repaired"

      # ---------------------------------------------------------------------
      # Three in-place repairs to build.sh. Each is idempotent and reports
      # what it did, so the log always shows the current state.
      # ---------------------------------------------------------------------
      - name: Repair build.sh
        run: |
          set -x
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path("razef-os/build_files/build.sh")
          if not p.exists():
              sys.exit("ERROR: razef-os/build_files/build.sh not found")

          s = p.read_text()
          changed = False

          # (a) plymouth theme must be forced into the initramfs
          if "plymouth-set-default-theme razef" in s:
              print("plymouth install_items: already present")
          else:
              anchor = "    # Atomic images symlink /root -> /var/root."
              if anchor not in s:
                  anchor = "    DRACUT_NO_XATTR=1 dracut"
              if anchor not in s:
                  sys.exit("ERROR: could not find the dracut section in build.sh")
              block = "\n".join([
                  "    # --- force the splash theme into the initramfs ---------------------",
                  "    # dracut's plymouth module installs the theme reported by",
                  "    # plymouth-set-default-theme, and only in hostonly mode. A",
                  "    # redistributable image is built --no-hostonly, so that never runs.",
                  "    if command -v plymouth-set-default-theme >/dev/null 2>&1; then",
                  "        plymouth-set-default-theme razef >/dev/null 2>&1 || true",
                  "    fi",
                  "    if [ -f /usr/share/plymouth/plymouthd.defaults ]; then",
                  "        sed -i 's/^Theme=.*/Theme=razef/' /usr/share/plymouth/plymouthd.defaults",
                  "    fi",
                  "    install -d /etc/plymouth",
                  "    printf '[Daemon]\\nTheme=razef\\nShowDelay=0\\nDeviceTimeout=8\\n' > /etc/plymouth/plymouthd.conf",
                  '    theme_items="/etc/plymouth/plymouthd.conf"',
                  '    for f in /usr/share/plymouth/themes/razef/*; do',
                  '        if [ -f "${f}" ]; then',
                  '            theme_items="${theme_items} ${f}"',
                  "        fi",
                  "    done",
                  "    for plug in /usr/lib64/plymouth/two-step.so /usr/lib/plymouth/two-step.so; do",
                  '        if [ -e "${plug}" ]; then',
                  '            theme_items="${theme_items} ${plug}"',
                  "        fi",
                  "    done",
                  '    printf \'install_items+=" %s "\\n\' "${theme_items}" > /etc/dracut.conf.d/99-razef-plymouth.conf',
                  '    echo "dracut install_items: $(cat /etc/dracut.conf.d/99-razef-plymouth.conf)"',
                  "",
              ])
              s = s.replace(anchor, block + anchor, 1)
              changed = True
              print("plymouth install_items: inserted")

          # (b) dracut needs the /root symlink target
          if "realpath /root" in s:
              print("dracut /root fix: already present")
          else:
              anchor = "    DRACUT_NO_XATTR=1 dracut"
              if anchor not in s:
                  sys.exit("ERROR: could not find the dracut call in build.sh")
              fix = "\n".join([
                  "    # Atomic images symlink /root -> /var/root; dracut-install fails",
                  '    # with "ERROR: installing /root" when that target is missing.',
                  '    install -d "$(realpath /root 2>/dev/null || echo /var/root)"',
                  "",
              ])
              s = s.replace(anchor, fix + anchor, 1)
              changed = True
              print("dracut /root fix: inserted")

          # (c) no build-time content under /var (bootc container lint rejects it)
          vardir = "    install -d -o ollama -g ollama -m 0755 /var/lib/ollama /var/lib/ollama/models"
          if vardir in s:
              s = s.replace(
                  vardir,
                  "    # /var content is created at boot by tmpfiles.d, not baked\n"
                  "    # into the image (build-time /var content fails bootc lint)",
                  1,
              )
              changed = True
              print("var/lib/ollama: moved to tmpfiles.d")
          else:
              print("var/lib/ollama: nothing to change")

          # (d) a shippable image wants a generic initramfs
          if "        --no-hostonly \\" in s:
              print("dracut --no-hostonly: already present")
          else:
              old = "        --reproducible \\\n"
              if old in s:
                  s = s.replace(old, old + "        --no-hostonly \\\n", 1)
                  changed = True
                  print("dracut --no-hostonly: inserted")
              else:
                  print("dracut --no-hostonly: could not locate the --reproducible flag")

          if changed:
              p.write_text(s)
          PY

          mkdir -p razef-os/system_files/overrides/usr/lib/tmpfiles.d
          TMPF=razef-os/system_files/overrides/usr/lib/tmpfiles.d/razef-ollama.conf
          if [ ! -f "${TMPF}" ]; then
            printf '%s\n' \
              '# Razef Assistant: AI models live on the writable /var so they survive' \
              '# image updates. Created at boot, not baked into the image.' \
              'd /var/lib/ollama         0755 ollama ollama -' \
              'd /var/lib/ollama/models  0755 ollama ollama -' > "${TMPF}"
            echo "created ${TMPF}"
          else
            echo "${TMPF} already present"
          fi

          bash -n razef-os/build_files/build.sh

      # ---------------------------------------------------------------------
      # Every patch must be present before we spend 15 minutes building.
      # ---------------------------------------------------------------------
      - name: Verify patches applied
        run: |
          set -x
          FAIL=0
          need() { if grep -q -e "$1" razef-os/build_files/build.sh; then echo "OK   $2"; else echo "::error title=Patch missing::$2"; FAIL=1; fi; }
          need 'tar.zst'                         "build.sh downloads the current Ollama artifacts"
          need 'plymouth-set-default-theme razef' "splash theme forced into the initramfs"
          need '99-razef-plymouth.conf'          "dracut install_items written"
          need 'realpath /root'                  "dracut /root symlink fix"
          need '^ *--no-hostonly'             "generic initramfs (flag, not comment)"
          if grep -q 'install -d -o ollama' razef-os/build_files/build.sh; then
            echo "::error title=Patch missing::build-time /var creation still present"
            FAIL=1
          else
            echo "OK   no build-time /var content"
          fi
          echo "--- the dracut invocation ---"
          grep -n -A6 'dracut \\\\' razef-os/build_files/build.sh | head -20
          exit ${FAIL}

      - name: Pull base image
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -x
          for attempt in 1 2 3; do
            if podman pull "${BASE}"; then
              echo "pulled ${BASE} (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error title=Pull failed::could not pull ${BASE} after 3 attempts"; exit 1
            fi
            echo "attempt ${attempt} failed - retrying in 20s"
            sleep 20
          done

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BASE: ${{ matrix.base }}
          CUDA: ${{ matrix.cuda }}
        run: |
          set -o pipefail
          set -x
          podman build \
            --pull=missing \
            --build-arg BASE_IMAGE="${BASE}" \
            --build-arg WITH_CUDA="${CUDA}" \
            --tag "localhost/${IMAGE}:stable" \
            --file razef-os/Containerfile \
            razef-os 2>&1 | tee "build-${IMAGE}.log"

      - name: Report failure
        if: failure()
        run: |
          LOG="build-${{ matrix.image }}.log"
          {
            echo "## ❌ Build failed: ${{ matrix.image }}"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -nE 'Error|error:|denied|No space|not found|cannot|unable|failed|unknown flag|404' "$LOG" | tail -n 20 || true
              echo "----- last 25 lines -----"
              tail -n 25 "$LOG" || true
            else
              echo "No build log was produced - a step before the build failed."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR="$(grep -hE 'Error|error:|unknown flag' "$LOG" 2>/dev/null | tail -n 2 | tr '\n' ' ' | cut -c1-600)"
          echo "::error title=Build failed (${{ matrix.image }})::${ERR:-no log produced}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image }}
          path: build-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Log in to GHCR
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: success()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/${OWNER}/${IMAGE}:stable"
          podman tag "localhost/${IMAGE}:stable" "${TARGET}"
          podman push "${TARGET}"
          echo "✅ pushed ${TARGET}"
          echo "### ✅ \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
