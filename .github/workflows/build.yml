---
# ===========================================================================
# Razef OS build — v5
#
# Replaces the contents of  .github/workflows/build.yml
#
# Failure history (each one was a different, real bug):
#   v1  2m29s  exit 125  build_files/build.sh had no executable bit
#   v2  0s     exit 125  --logfile / --security-opt don't exist in podman 4.x
#   v3  0s     exit 125  `podman pull --retry` doesn't exist in podman 4.x
#   v4  ~1m    exit 125  "no FROM statement found"
#                        -> ARG BASE_IMAGE was declared AFTER the first FROM,
#                           which makes it stage-local, so `FROM ${BASE_IMAGE}`
#                           expanded to an empty string.
#
# v5 repairs that file in place before building (no repo edit needed):
#   1. delete the "# syntax=" BuildKit frontend line  (Docker Hub rate limits)
#   2. hoist "ARG BASE_IMAGE" above the first FROM     (fixes no-FROM error)
#   3. print the result and hard-fail if the order is still wrong
# ===========================================================================
name: Build Razef OS image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razef-os
            base: ghcr.io/ublue-os/bazzite-gnome:stable
          - image: razef-os-nvidia
            base: ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
            /opt/az /opt/pipx /opt/google /usr/local/share/boost \
            /usr/lib/jvm 2>/dev/null || true
          podman system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Fix file modes
        run: |
          set -x
          chmod +x razef-os/build_files/build.sh || true
          chmod +x razef-os/scripts/*.sh 2>/dev/null || true
          chmod +x razef-os/system_files/overrides/usr/bin/* 2>/dev/null || true
          ls -l razef-os/build_files/build.sh

      # ---------------------------------------------------------------------
      # Repair the Containerfile that is in the repo, so no manual edit of a
      # second file is needed. Everything here is verified by the step itself.
      # ---------------------------------------------------------------------
      - name: Repair Containerfile
        run: |
          set -x
          test -f razef-os/Containerfile || { echo "::error title=Missing Containerfile::razef-os/Containerfile not found in the checkout"; exit 1; }
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path("razef-os/Containerfile")
          lines = p.read_text().splitlines()

          # 1. drop the BuildKit frontend directive (it pulls from Docker Hub)
          before = len(lines)
          lines = [l for l in lines if not l.lstrip().startswith("# syntax=")]
          if len(lines) != before:
              print("removed the BuildKit frontend directive")

          # 2. a global ARG must appear before the first FROM, otherwise
          #    "FROM ${BASE_IMAGE}" resolves to nothing
          args = [l for l in lines if re.match(r"^ARG\s+BASE_IMAGE", l)]
          if not args:
              args = ['ARG BASE_IMAGE="ghcr.io/ublue-os/bazzite-gnome:stable"']
              print("added a missing default ARG BASE_IMAGE")
          lines = [l for l in lines if not re.match(r"^ARG\s+BASE_IMAGE", l)]

          first_from = next((i for i, l in enumerate(lines) if l.startswith("FROM")), None)
          if first_from is None:
              sys.exit("ERROR: the Containerfile has no FROM at all")
          lines[first_from:first_from] = args + [""]

          p.write_text("\n".join(lines) + "\n")
          print("hoisted:", args[0])
          PY

          echo "--- first 12 lines after repair ---"
          head -12 razef-os/Containerfile

          # 3. verify the order really is correct
          ARG_LINE=$(grep -n '^ARG BASE_IMAGE' razef-os/Containerfile | head -1 | cut -d: -f1)
          FROM_LINE=$(grep -n '^FROM' razef-os/Containerfile | head -1 | cut -d: -f1)
          echo "ARG BASE_IMAGE on line ${ARG_LINE}, first FROM on line ${FROM_LINE}"
          if [ -z "${ARG_LINE}" ] || [ "${ARG_LINE}" -ge "${FROM_LINE}" ]; then
            echo "::error title=Containerfile repair failed::ARG BASE_IMAGE must come before the first FROM"
            exit 1
          fi
          grep -q 'FROM ${BASE_IMAGE}' razef-os/Containerfile && echo "OK: FROM \${BASE_IMAGE} will resolve" || echo "note: no FROM \${BASE_IMAGE} found (fine if hardcoded)"

      - name: Pull base image
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -x
          for attempt in 1 2 3; do
            if podman pull "${BASE}"; then
              echo "pulled ${BASE} (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error title=Pull failed::could not pull ${BASE} after 3 attempts"
              exit 1
            fi
            echo "attempt ${attempt} failed - retrying in 20s"
            sleep 20
          done

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          set -x
          podman build \
            --pull=missing \
            --build-arg BASE_IMAGE="${BASE}" \
            --tag "localhost/${IMAGE}:stable" \
            --file razef-os/Containerfile \
            razef-os 2>&1 | tee "build-${IMAGE}.log"

      - name: Report failure
        if: failure()
        run: |
          LOG="build-${{ matrix.image }}.log"
          {
            echo "## ❌ Build failed: ${{ matrix.image }}"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -nE 'Error|error:|denied|No space|not found|cannot|unable|failed|unknown flag' "$LOG" | tail -n 20 || true
              echo "----- last 25 lines -----"
              tail -n 25 "$LOG" || true
            else
              echo "No build log: podman refused to start."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR="$(grep -hE 'Error|error:|unknown flag' "$LOG" 2>/dev/null | tail -n 2 | tr '\n' ' ' | cut -c1-600)"
          echo "::error title=Build failed (${{ matrix.image }})::${ERR:-no log produced}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image }}
          path: build-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Log in to GHCR
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: success()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/${OWNER}/${IMAGE}:stable"
          podman tag "localhost/${IMAGE}:stable" "${TARGET}"
          podman push "${TARGET}"
          echo "✅ pushed ${TARGET}"
          echo "### ✅ \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
