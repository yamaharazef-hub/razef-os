---
# ===========================================================================
# Razef OS build — v7
#
# Replaces the contents of  .github/workflows/build.yml
#
# Failure history:
#   v1  2m29s  build_files/build.sh had no executable bit
#   v2  0s     --logfile / --security-opt don't exist in podman 4.x
#   v3  0s     `podman pull --retry` doesn't exist in podman 4.x
#   v4  ~1m    ARG BASE_IMAGE was declared after the first FROM
#   v5  ~9m    Ollama download 404: upstream moved from .tgz to .tar.zst
#   v6  ~12m   dracut: "ERROR: installing '/root'" -> /root is a symlink to
#              /var/root and the target did not exist in the build container
#              (the initramfs assertion caught it, which is what it is for)
#
# v7 changes
#   * patches build_files/build.sh in the runner: creates the /root symlink
#     target before dracut runs. You do NOT need to re-upload build.sh.
#   * keeps every earlier repair (Containerfile ARG hoist, mode fixes, .tar.zst
#     check)
#
# v6 changes
#   * builds the image with the CURRENT Ollama artifact names (handled inside
#     build_files/build.sh, which must be updated once — see below)
#   * CUDA backends are opt-in per image: the NVIDIA build sets WITH_CUDA=1
#     (+2.3 GB), the AMD/Intel build stays at CPU+Vulkan (114 MB)
#   * repair step now also reports whether build.sh is the old or new version,
#     so a stale file fails loudly with instructions instead of a 404
# ===========================================================================
name: Build Razef OS image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: razef-os
            base: ghcr.io/ublue-os/bazzite-gnome:stable
            cuda: 0
          - image: razef-os-nvidia
            base: ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable
            cuda: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
            /opt/az /opt/pipx /opt/google /usr/local/share/boost \
            /usr/lib/jvm 2>/dev/null || true
          podman system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Fix file modes
        run: |
          set -x
          chmod +x razef-os/build_files/build.sh || true
          chmod +x razef-os/scripts/*.sh 2>/dev/null || true
          chmod +x razef-os/system_files/overrides/usr/bin/* 2>/dev/null || true
          ls -l razef-os/build_files/build.sh

      # ---------------------------------------------------------------------
      # Repair the Containerfile in place: drop the BuildKit frontend line and
      # hoist ARG BASE_IMAGE above the first FROM.
      # ---------------------------------------------------------------------
      - name: Repair Containerfile
        run: |
          set -x
          test -f razef-os/Containerfile || { echo "::error title=Missing Containerfile::razef-os/Containerfile not found"; exit 1; }
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path("razef-os/Containerfile")
          lines = p.read_text().splitlines()

          before = len(lines)
          lines = [l for l in lines if not l.lstrip().startswith("# syntax=")]
          if len(lines) != before:
              print("removed the BuildKit frontend directive")

          args = [l for l in lines if re.match(r"^ARG\s+BASE_IMAGE", l)]
          if not args:
              args = ['ARG BASE_IMAGE="ghcr.io/ublue-os/bazzite-gnome:stable"']
              print("added a missing default ARG BASE_IMAGE")
          lines = [l for l in lines if not re.match(r"^ARG\s+BASE_IMAGE", l)]

          first_from = next((i for i, l in enumerate(lines) if l.startswith("FROM")), None)
          if first_from is None:
              sys.exit("ERROR: the Containerfile has no FROM at all")
          lines[first_from:first_from] = args + [""]
          p.write_text("\n".join(lines) + "\n")
          print("hoisted:", args[0])
          PY

          ARG_LINE=$(grep -n '^ARG BASE_IMAGE' razef-os/Containerfile | head -1 | cut -d: -f1)
          FROM_LINE=$(grep -n '^FROM' razef-os/Containerfile | head -1 | cut -d: -f1)
          echo "ARG BASE_IMAGE on line ${ARG_LINE}, first FROM on line ${FROM_LINE}"
          [ -n "${ARG_LINE}" ] && [ "${ARG_LINE}" -lt "${FROM_LINE}" ] || {
            echo "::error title=Containerfile repair failed::ARG BASE_IMAGE must come before the first FROM"; exit 1; }

      # ---------------------------------------------------------------------
      # Patch build.sh: Atomic images symlink /root -> /var/root and dracut
      # aborts with "ERROR: installing '/root'" when that target is missing.
      # ---------------------------------------------------------------------
      - name: Repair build.sh
        run: |
          set -x
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path("razef-os/build_files/build.sh")
          if not p.exists():
              sys.exit("ERROR: razef-os/build_files/build.sh not found")

          s = p.read_text()
          if "realpath /root" in s:
              print("build.sh already fixed - nothing to do")
          else:
              anchor = "    DRACUT_NO_XATTR=1 dracut \\"
              if anchor not in s:
                  sys.exit("ERROR: could not find the dracut call in build.sh")
              fix = (
                  '    # Atomic images symlink /root -> /var/root; dracut-install fails with\n'
                  '    # "ERROR: installing \'/root\'" when that target does not exist.\n'
                  '    install -d "$(realpath /root 2>/dev/null || echo /var/root)"\n\n'
              )
              s = s.replace(anchor, fix + anchor, 1)
              p.write_text(s)
              print("inserted the /root fix before the dracut call")
          PY
          bash -n razef-os/build_files/build.sh
          grep -n -B1 'DRACUT_NO_XATTR' razef-os/build_files/build.sh | head -6

      # ---------------------------------------------------------------------
      # Guard against a stale build_files/build.sh (the file that downloads
      # Ollama). If it still contains the old .tgz URL the build would 404.
      # ---------------------------------------------------------------------
      - name: Verify build.sh is up to date
        run: |
          set -x
          if grep -q "ollama-linux-\${ollama_arch}.tgz\"" razef-os/build_files/build.sh; then
            echo "::error title=build_files/build.sh is outdated::It still downloads the removed Ollama .tgz (404). Replace razef-os/build_files/build.sh with the current version from the Razef repo/zip and re-run."
            exit 1
          fi
          grep -q 'tar.zst' razef-os/build_files/build.sh && echo "OK: build.sh uses the current .tar.zst artifacts"

      - name: Pull base image
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -x
          for attempt in 1 2 3; do
            if podman pull "${BASE}"; then
              echo "pulled ${BASE} (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error title=Pull failed::could not pull ${BASE} after 3 attempts"; exit 1
            fi
            echo "attempt ${attempt} failed - retrying in 20s"
            sleep 20
          done

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BASE: ${{ matrix.base }}
          CUDA: ${{ matrix.cuda }}
        run: |
          set -o pipefail
          set -x
          podman build \
            --pull=missing \
            --build-arg BASE_IMAGE="${BASE}" \
            --build-arg WITH_CUDA="${CUDA}" \
            --tag "localhost/${IMAGE}:stable" \
            --file razef-os/Containerfile \
            razef-os 2>&1 | tee "build-${IMAGE}.log"

      - name: Report failure
        if: failure()
        run: |
          LOG="build-${{ matrix.image }}.log"
          {
            echo "## ❌ Build failed: ${{ matrix.image }}"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -nE 'Error|error:|denied|No space|not found|cannot|unable|failed|unknown flag|404' "$LOG" | tail -n 20 || true
              echo "----- last 25 lines -----"
              tail -n 25 "$LOG" || true
            else
              echo "No build log: podman refused to start."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR="$(grep -hE 'Error|error:|unknown flag' "$LOG" 2>/dev/null | tail -n 2 | tr '\n' ' ' | cut -c1-600)"
          echo "::error title=Build failed (${{ matrix.image }})::${ERR:-no log produced}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image }}
          path: build-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Log in to GHCR
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: success()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/${OWNER}/${IMAGE}:stable"
          podman tag "localhost/${IMAGE}:stable" "${TARGET}"
          podman push "${TARGET}"
          echo "✅ pushed ${TARGET}"
          echo "### ✅ \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
